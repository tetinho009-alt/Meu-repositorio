# Placar ao vivo no GitHub Pages: a cada 30 minutos lê as APIs oficiais e publica o site com o placar.json novo.
# Vai para .github/workflows/placar.yml no repositório do site (o preparar.py copia). Chaves só em Settings > Secrets.
name: placar

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: placar
  cancel-in-progress: false

jobs:
  placar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Placar anterior (se uma rede falhar, fica a última leitura boa dela)
        run: curl -fsS "${{ steps.pages.outputs.base_url }}/placar.json" -o site/placar.json || true
      - name: Ler votos e métricas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
        run: python placar.py --episodios episodios.json --saida site/placar.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
