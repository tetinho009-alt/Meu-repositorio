<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização do TikTok</title>
<style>
  :root { --fundo: #0f1424; --cartao: #181e31; --borda: #2a3350; --texto: #eef2fa; --suave: #9aa4ba; --destaque: #2963c4; }
  @media (prefers-color-scheme: light) { :root { --fundo: #f4f6fb; --cartao: #fff; --borda: #dde3ee; --texto: #141a2b; --suave: #56607a; } }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  code { display: block; word-break: break-all; background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px;
         padding: 14px; margin: 12px 0; }
  button { font: inherit; padding: 10px 18px; border-radius: 99px; border: 0; background: var(--destaque); color: #fff; cursor: pointer; }
  p { color: var(--suave); }
</style>
</head>
<body>
<main>
  <h1>Autorização do TikTok</h1>
  <div id="saida"></div>
</main>
<script>
  // Esta página só mostra o código de uso único que o TikTok devolve. Ela não envia nada a lugar nenhum: a troca do
  // código pelo acesso acontece no seu computador, com a chave secreta que nunca sai dele.
  const q = new URLSearchParams(location.search);
  const el = document.getElementById("saida");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  if (q.get("code")) {
    el.innerHTML = `<p>Copie o código e rode no computador, em até 5 minutos:</p><code id="c">${esc(q.get("code"))}</code>
      <button id="b">Copiar o código</button>
      <p>python placar/placar.py --episodios placar/episodios.json --tiktok-codigo CODIGO</p>`;
    document.getElementById("b").onclick = () => navigator.clipboard.writeText(q.get("code"))
      .then(() => { document.getElementById("b").textContent = "Copiado"; });
  } else {
    el.innerHTML = `<p>O TikTok não mandou o código${q.get("error") ? ": " + esc(q.get("error_description") || q.get("error")) : ""}.
      Abra de novo o link gerado por <b>--tiktok-link</b>.</p>`;
  }
</script>
</body>
</html>
